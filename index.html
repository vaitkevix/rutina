<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutīna</title>
<meta name="theme-color" content="#F4EFE8">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="icon" href="icon-192.png?v=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#F4EFE8,#1E1A17);--card:light-dark(#FBF8F4,#29231F);--ink:light-dark(#2B2622,#F1E9E0);--muted:light-dark(#6B625B,#B3A79B);--accent:light-dark(#8C6A55,#C29C82)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
main{width:100%;max-width:420px;text-align:center}
h1{font:500 44px/1.05 'Cormorant Garamond',Georgia,serif;margin:0 0 8px}
h1 i{color:var(--accent)}
p{color:var(--muted);margin:0 0 28px;font-size:15px}
a.p{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:0 22px;margin-bottom:10px;background:var(--card);border-radius:20px;color:var(--ink);text-decoration:none;font:500 26px 'Cormorant Garamond',Georgia,serif}
a.p span{font:14px Inter,sans-serif;color:var(--muted)}
a.p:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small{display:block;margin-top:24px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Kura <i>rutīna?</i></h1>
<p>Izvēlies savu profilu. Atzīmes katram glabājas atsevišķi.</p>
<a class="p" href="silvestrs/">Silvestrs <span>atvērt →</span></a>
<a class="p" href="sintija/">Sintija <span>atvērt →</span></a>
<small>Pēc atvēršanas: Safari → Share → Add to Home Screen</small>
</main>
</body>
</html>
