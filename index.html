<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutīna</title>
<meta name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="icon" href="icon-192.png?v=1">
<style>
:root{color-scheme:light dark;--bg:light-dark(#F2F2F7,#000000);--card:light-dark(#FFFFFF,#1C1C1E);--ink:light-dark(#000000,#FFFFFF);--muted:light-dark(#6E6E73,#98989F);--accent:light-dark(#8C6A55,#D2AE94)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
main{width:100%;max-width:420px;text-align:center}
h1{font-size:34px;font-weight:700;letter-spacing:-.4px;line-height:1.1;margin:0 0 8px}
h1 i{font-style:normal;color:var(--accent)}
p{color:var(--muted);margin:0 0 28px;font-size:15px}
a.p{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:0 22px;margin-bottom:10px;background:var(--card);border-radius:20px;color:var(--ink);text-decoration:none;font-size:17px;font-weight:600;border-radius:14px}
a.p span{font-size:15px;font-weight:400;color:var(--muted)}
a.p:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small{display:block;margin-top:24px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Kura <i>rutīna?</i></h1>
<p>Izvēlies savu profilu. Atzīmes katram glabājas atsevišķi.</p>
<a class="p" href="silvestrs/">Silvestrs <span>atvērt →</span></a>
<a class="p" href="sintija/">Sintija <span>atvērt →</span></a>
<small>Pēc atvēršanas: Safari → Share → Add to Home Screen</small>
</main>
</body>
</html>
